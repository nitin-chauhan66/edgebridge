# EdgeBridge-S3 Phase 0 — Zephyr RTOS Configuration
# Target: Waveshare ESP32-S3-RS485-CAN (ESP32-S3R8: 16MB Flash + 8MB Octal PSRAM)

# --- MCUboot & Image Manager ---
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_REBOOT=y

# --- 8MB Octal PSRAM Offload (Solves BLE + Wi-Fi SRAM Crashes, <35% SRAM target) ---
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

# --- USB-C CDC-ACM Console (Non-blocking deferred logging avoids boot/DTR stall) ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096

# --- RS-485 (UART1) & CAN (TWAI) ---
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
CONFIG_CAN=y
CONFIG_CAN_MAX_FILTER=16

# --- Persistent Storage: LittleFS (7.1MB telemetry_fs) & NVS (512KB nvs_config) ---
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=4096
CONFIG_NVS=y

# --- Networking, Wi-Fi STA + SoftAP Fallback, MQTT TLS & Web Bus Analyzer ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_SERVER=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y
CONFIG_DNS_RESOLVER=y
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_HEAP_SIZE=65536

# --- Ephemeral BLE Provisioning (Shut down via bt_disable() once provisioned) ---
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EdgeBridge-S3"
CONFIG_BT_GATT_DYNAMIC_DB=y

# --- Deterministic Threading & Hardware Watchdog ---
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_WATCHDOG=y
CONFIG_WDT_ESP32=y
