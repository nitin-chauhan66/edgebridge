name: Release EdgeBridge-S3

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Verification Suite
        run: |
          chmod +x tests/run_tests.sh
          ./tests/run_tests.sh

      - name: Validate Device Profiles & Docs
        run: |
          node --check docs/app.js
          for f in profiles/*.json; do python3 -m json.tool "$f" > /dev/null; done

      - name: Package Release Bundle
        run: |
          mkdir -p dist
          tar -czf "dist/edgebridge-s3-${GITHUB_REF_NAME}-phase0-src.tar.gz" \
            --exclude='.git' --exclude='dist' --exclude='keys' .
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --title "EdgeBridge-S3 ${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            --generate-notes
